work_dir: ./work_dir/anubis/sttformer_joint
run_mode: train

# feeder
feeder: feeders.feeder_anubis.Feeder
train_feeder_args:
  data_path: dataset/anubis/trn_data_all_action_front.npy  
  label_path: dataset/anubis/trn_label_all_action_front.pkl
  split: train
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False
  random_rot: True
  p_interval: [0.5, 1]
  vel: True
  bone: True
  use_mmap: True

test_feeder_args:
  data_path: dataset/anubis/val_data_all_action_back.npy
  label_path: dataset/anubis/val_label_all_action_back.pkl
  split: test
  debug: False
  window_size: -1
  p_interval: [0.95]
  vel: True
  bone: True
  use_mmap: True

# model
model: model.sttformer.Model
model_args:
  len_parts: 6
  num_frames: 300
  num_joints: 32   
  num_classes: 102 
  num_heads: 3
  kernel_size: [3, 5]
  num_persons: 2
  num_channels: 3
  use_pes: True
  config: [[64,  64,  16], [64,  64,  16], 
           [64,  128, 32], [128, 128, 32],
           [128, 256, 64], [256, 256, 64], 
           [256, 256, 64], [256, 256, 64]]

#optim
weight_decay: 0.0004
base_lr: 0.05  
lr_decay_rate: 0.1
step: [30]  
warm_up_epoch: 5

# training
device: [0]  
cuda_visible_device: '0'
batch_size: 1  
test_batch_size: 1
num_epoch: 50
nesterov: True
num_worker: 0  